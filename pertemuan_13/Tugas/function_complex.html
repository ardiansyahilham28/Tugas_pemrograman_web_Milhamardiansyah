<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNCTION KOMPLEX</title>
</head>
<body>
    <script>    
            console.log("\n=== CONTOH 2A: CLOSURE ===\n");
 
            // Closure: createDiscount menyimpan nilai 'persen'
            // dan mengembalikan fungsi baru yang bisa dipakai kapan saja
            function createDiscount(persen) {
            return function(harga) {
                const hemat = harga * (persen / 100);
                const bayar = harga - hemat;
                return { harga, hemat, bayar };
            };
            }
            
            const diskon20 = createDiscount(20);  // closure: persen = 20 tersimpan
            const diskon50 = createDiscount(50);  // closure: persen = 50 tersimpan
            
            console.log("Diskon 20% dari Rp350.000 :", diskon20(350000));
            console.log("Diskon 50% dari Rp350.000 :", diskon50(350000));
            console.log("Diskon 20% dari Rp80.000  :", diskon20(80000));
            
            
            console.log("\n=== CONTOH 2B: HIGHER-ORDER FUNCTION ===\n");
            
            // Higher-Order Function: menerima fungsi sebagai argumen
            function filterAndTransform(arr, filterFn, transformFn) {
            return arr
                .filter(filterFn)      // fungsi pertama: penyaring
                .map(transformFn);     // fungsi kedua: pengubah format
            }
            
            const produk = [
            { nama: "Sepatu", harga: 350000 },
            { nama: "Kaos",   harga: 80000  },
            { nama: "Jaket",  harga: 520000 },
            { nama: "Topi",   harga: 65000  },
            ];
            
            // Filter produk harga > 100rb, lalu format jadi label teks
            const produkMahal = filterAndTransform(
            produk,
            (p) => p.harga > 100000,                               // filterFn
            (p) => `${p.nama}: Rp${p.harga.toLocaleString("id")}` // transformFn
            );
            
            console.log("Produk dengan harga > Rp100.000:");
            produkMahal.forEach((item) => console.log(" -", item));
            
            
            console.log("\n=== CONTOH 2C: REKURSI ===\n");
            
            // Rekursi: fungsi memanggil dirinya sendiri
            // Base case: n <= 1 → hentikan rekursi
            function faktorial(n) {
            if (n <= 1) return 1;          // base case
            return n * faktorial(n - 1);   // recursive call
            }
            
            // Rekursi: hitung jumlah digit angka
            function jumlahDigit(n) {
            n = Math.abs(n);               // pastikan positif
            if (n < 10) return n;          // base case: 1 digit
            return (n % 10) + jumlahDigit(Math.floor(n / 10));
            }
            
            for (let i = 1; i <= 7; i++) {
            console.log(`faktorial(${i}) = ${faktorial(i)}`);
            }
            
            console.log("---");
            console.log(`jumlahDigit(1234)  = ${jumlahDigit(1234)}`);   // 1+2+3+4 = 10
            console.log(`jumlahDigit(9876)  = ${jumlahDigit(9876)}`);   // 9+8+7+6 = 30
    </script>
    
</body>
</html>
